<!-- APRENDE: Icono lazo. Este archivo dibuja una imagen con formas. Para usar otro icono en la página, cambia
     src de su img en HTML. Para probar otro color aquí, cambia stroke o fill; algunas reglas de estilos.css lo
     convierten en blanco. -->
<!-- APRENDE: Espacio de dibujo: viewBox="0 0 24 24" equivale a una hoja de 24 por 24 unidades. Conserva este
     marco para no recortar el símbolo. stroke elige el color de las líneas, stroke-width su grosor (prueba 2.2
     en lugar de 1.8). fill="none" deja el interior vacío; round suaviza extremos y esquinas. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#6E2E94" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- APRENDE: Trazo de una parte del icono. Usa el color y grosor elegidos en svg. d indica por dónde se
       dibuja: M mueve el lápiz, L dibuja una recta, H/V una línea horizontal/vertical, C una curva y A un arco;
       Z cierra la figura. Mayúsculas indican posiciones y minúsculas desplazamientos. Prueba cambiar una medida
       cada vez para observar la forma. -->
  <path d="M12 2.5c-2.1 0-3.6 1.6-3.6 3.7 0 2.1 1.4 4.1 3.6 6.6 2.2-2.5 3.6-4.5 3.6-6.6 0-2.1-1.5-3.7-3.6-3.7Z"/>
  <!-- APRENDE: Trazo de una parte del icono. Usa el color y grosor elegidos en svg. d indica por dónde se
       dibuja: M mueve el lápiz, L dibuja una recta, H/V una línea horizontal/vertical, C una curva y A un arco;
       Z cierra la figura. Mayúsculas indican posiciones y minúsculas desplazamientos. Prueba cambiar una medida
       cada vez para observar la forma. -->
  <path d="M10.2 10.6 5 21.5l3.2-1.2 1.6 2.4 4.4-8.8"/>
  <!-- APRENDE: Trazo de una parte del icono. Usa el color y grosor elegidos en svg. d indica por dónde se
       dibuja: M mueve el lápiz, L dibuja una recta, H/V una línea horizontal/vertical, C una curva y A un arco;
       Z cierra la figura. Mayúsculas indican posiciones y minúsculas desplazamientos. Prueba cambiar una medida
       cada vez para observar la forma. -->
  <path d="M13.8 10.6 19 21.5l-3.2-1.2-1.6 2.4-1.6-3.2"/></svg>
